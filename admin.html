<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.S Tyre Care | Admin Dashboard</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #050708; --bg-card: #111620; --accent: #18c25c; --text-primary: #f0f4f8; --text-secondary: #8899aa; --border: rgba(255, 255, 255, 0.06);
    }
    body { font-family: 'Sora', sans-serif; background: var(--bg-void); color: var(--text-primary); margin: 0; padding: 40px 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    h1 { margin: 0; font-size: 28px; font-weight: 800; }
    
    .admin-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    th { font-size: 13px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 1px; }
    td { font-size: 14px; color: var(--text-primary); }
    tr:last-child td { border-bottom: none; }
    
    .delete-btn { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .delete-btn:hover { background: #ff4757; color: #fff; }
    .refresh-btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: 700; transition: 0.3s; }
    .refresh-btn:hover { transform: scale(1.05); }
    
    #securityScreen { position: fixed; inset: 0; background: var(--bg-void); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .pin-input { background: var(--bg-card); border: 1px solid var(--border); color: #fff; padding: 15px; border-radius: 8px; font-size: 18px; text-align: center; margin-bottom: 15px; outline: none; }
    .pin-input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <div id="securityScreen">
    <h2 style="margin-bottom: 10px;">Admin Access</h2>
    <p style="color: var(--text-secondary); margin-bottom: 20px;">Enter your PIN to manage reviews.</p>
    <input type="password" id="pinCode" class="pin-input" placeholder="****" maxlength="4">
    <button class="refresh-btn" onclick="checkPin()">Unlock Dashboard</button>
  </div>

  <div class="container" id="dashboard" style="display: none;">
    <div class="header">
      <h1>Review Management</h1>
      <button class="refresh-btn" onclick="fetchAdminReviews()">🔄 Refresh Data</button>
    </div>

    <div class="admin-card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Rating</th>
            <th>Message</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr><td colspan="5" style="text-align: center; color: var(--text-secondary);">Loading reviews...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
